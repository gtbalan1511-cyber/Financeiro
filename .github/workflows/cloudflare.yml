name: Verify and deploy Orbita on Cloudflare
on:
  push:
    branches: [main, feat/orbita-missao-02]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orbita-cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:multiplatform
      - run: npm run test:worker
      - run: npm run cloudflare:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbita-verification
          path: |
            BROWSER-RESULTS.json
            MULTIPLATFORM-RESULTS.json
            WORKER-RESULTS.json
            dist/*.zip
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORBITA_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      ORBITA_PRODUCTION_URL: ${{ vars.ORBITA_PRODUCTION_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Bind the provisioned D1 database
        run: node tools/configure-cloudflare.cjs
      - name: Additive database migrations
        run: npx wrangler d1 migrations apply orbita-progress --remote
      - name: Publish verified application
        run: npm run cloudflare:deploy
      - name: Check public page, API, database and OAuth configuration
        run: node server/check-production.cjs
